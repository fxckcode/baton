# Release config only. v0.1 does not publish tags or run a release workflow.
version: 2

project_name: baton

builds:
  - id: baton
    main: ./cmd/baton
    binary: baton
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/fxckcode/baton/internal/cli.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"
